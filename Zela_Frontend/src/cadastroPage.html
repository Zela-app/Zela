<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/homePage.css">
  <link rel="stylesheet" href="./css/cadastroPage.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Zela - Segurança Inteligente/cadastro</title>
</head>
<body>
  <!--Lado esquerdo banner-->
 <div class="cadastro-container">
    <aside class="sidebar">
      <div class="brand-header">
        <div class="logo">
          <img src="/Zela_Frontend/assets/icons/Zela_logo_padrao_branca.svg" alt="logo_zela">
        </div>
        <div class="msg-boas-vindas">
          <h2>Bem-Vinda!</h2>
          <p>Sua rede de proteção inteligente. Aqui, cada passo seu importa. Estamos prontos para cuidar de você, mesmo quando as palavras faltarem. Juntos, somos mais fortes.</p>
        </div>
      </div>
      <div class="sidebar-footer">
        <p>Segurança Inteligente para Mulheres</p>
        <p>v3.1 Beta</p>
      </div>
    </aside>

    <main class="main-content">
      <div class="form-card">
        <h3 class="form-title">CADASTRE-SE AQUI</h3>

        <div class="progress-bar">
          <div class="etapa ativa" data-step="1">1</div>
          <div class="progress-line"><div class="line-fill" id="line-1"></div></div>
          <div class="step" data-step="2">2</div>
          <div class="progress-line"><div class="line-fill" id="line-2"></div></div>
          <div class="step" data-step="3">3</div>
        </div>

        <form id="cadastroForm">
          <section id="etapa-1" class="form-section active">
            <div class="input-group">
              <i class="fa-solid fa-user"></i>
              <label for="name">Nome completo</label>
              <input type="text" id="name" placeholder="Ex: Maria Souza" required>
              
            </div>
            <div class="input-group">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
            </div>
            <div class="input-group">
              <i class="fa-solid fa-calendar-days"></i>
              <label>Data de nascimento</label>
              <div class="date-grid">
                <input type="number" id="day" placeholder="Dia" min="1" max="31">
                <select id="month">
                  <option value="" disabled selected>Mês</option>
                  <option value="1">Janeiro</option>
                  <option value="2">Fevereiro</option>
                  <option value="3">Março</option>
                  <option value="4">Abril</option>
                  <option value="5">Maio</option>
                  <option value="6">Junho</option>
                  <option value="7">Julho</option>
                  <option value="8">Agosto</option>
                  <option value="9">Setembro</option>
                  <option value="10">Outubro</option>
                  <option value="11">Novembro</option>
                  <option value="12">Dezembro</option>
                  </select>
                <input type="number" id="year" placeholder="Ano" min="1900" max="2026">
              </div>
            </div>
          </section>

          <section id="etapa-2" class="form-section">
            <div class="input-group">
              <i class="fa-solid fa-envelope"></i>
              <label for="email">E-mail</label>
              <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
            </div>
            <div class="input-group">
              <i class="fa-solid fa-phone"></i>
              <label for="phone">Celular / WhatsApp</label>
              <input type="tel" id="phone" placeholder="(00) 00000-0000" required>
            </div>
          </section>

          <section id="etapa-3" class="form-section">
            <div class="input-group">
              <i class="fa-solid fa-lock"></i>
              <label for="password">Crie uma Senha</label>
              <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
            </div>
             <div class="input-group">
             <i class="fa-solid fa-circle-check"></i>
              <label for="password">Confirme sua senha</label>
              <input type="password" id="Confirmepassword" placeholder="Mínimo 8 caracteres" required>
            </div>
            <div class="terms-group">
              <input type="checkbox" id="terms" required>
              <label for="terms">Concordo com os Termos e Privacidade</label>
            </div>
          </section>

          <div class="form-actions">
            <button type="button" id="prevBtn" class="btn-link hidden">Voltar</button>
            <button type="button" id="nextBtn" class="btn-primary">Próximo →</button>
            <button type="submit" id="submitBtn" class="btn-primary hidden">Finalizar Cadastro</button>
          </div>
        </form>
      </div>
    </main>
  </div>
 
</body>
</html>
